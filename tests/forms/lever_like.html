<!doctype html>
<html><head><meta charset="utf-8"><title>Lever-style application</title></head>
<body>
<form onsubmit="window.submitted = true; return false;">
  <ul>
    <li><div class="application-label">Resume/CV ✱</div><input type="file" name="resume"></li>
    <li><div class="application-label">Full name ✱</div><input type="text" name="name" required></li>
    <li><div class="application-label">Email ✱</div><input type="email" name="email" required></li>
    <li><div class="application-label">Phone</div><input type="text" name="phone"></li>
    <li><div class="application-label">Current location</div><input type="text" name="location"></li>
    <li><div class="application-label">LinkedIn URL</div><input type="text" name="urls[LinkedIn]"></li>
    <li><div class="application-label">GitHub URL</div><input type="text" name="urls[GitHub]"></li>
    <li><div class="application-label">Additional information</div><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></li>
  </ul>
  <button type="submit" onclick="window.submitted = true">Submit application</button>
</form>
</body></html>
