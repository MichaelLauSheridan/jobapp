<!doctype html>
<html><head><meta charset="utf-8"><title>Apply – Data Analyst Intern</title></head>
<body>
<form id="application" onsubmit="window.submitted = true; return false;">
  <div><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" required></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" required></div>
  <div><label for="email">Email *</label><input id="email" type="email" required></div>
  <div><label for="phone">Phone</label><input id="phone" type="tel"></div>
  <div><label for="resume">Resume/CV *</label><input id="resume" type="file" required></div>
  <div><label for="cover">Cover Letter</label><input id="cover" type="file"></div>
  <div><label for="li">LinkedIn Profile</label><input id="li"></div>
  <div><label for="company">Current company name</label><input id="company"></div>
  <div><label for="typed">Website</label><input id="typed" value="already typed by you"></div>
  <div><label for="auth">Are you legally authorized to work in Canada? *</label>
    <select id="auth" required><option>Select...</option><option>Yes</option><option>No</option></select></div>
  <div><label for="ussp">Will you now or in the future require sponsorship to work in the United States?</label>
    <select id="ussp"><option>Select...</option><option>Yes</option><option>No</option></select></div>
  <fieldset><legend>Will you require visa sponsorship to work in Canada?</legend>
    <label><input type="radio" name="sp" value="1"> Yes</label>
    <label><input type="radio" name="sp" value="0"> No</label></fieldset>
  <div><label for="why">Why do you want to work here? *</label><textarea id="why" required></textarea></div>
  <div><label for="hear">How did you hear about us?</label>
    <select id="hear"><option>Select...</option><option>LinkedIn</option><option>Company Website</option><option>Other</option></select></div>
  <h3>Voluntary Self-Identification</h3>
  <div><label for="gender">Gender</label>
    <select id="gender"><option>Select...</option><option>Female</option><option>Male</option><option>Decline To Self Identify</option></select></div>
  <div><label for="race">Race / Ethnicity</label>
    <select id="race"><option>Select...</option><option>Black</option><option>East Asian</option><option>South Asian</option><option>White</option></select></div>
  <div><label for="vet">Veteran Status</label>
    <select id="vet"><option>Select...</option><option>I am a protected veteran</option><option>I am not a protected veteran</option></select></div>
  <div><label><input type="checkbox" id="consent" required> I agree to the privacy policy *</label></div>
  <div><label for="pw">Create a password</label><input id="pw" type="password"></div>
  <button type="submit" id="submit" onclick="window.submitted = true">Submit Application</button>
</form>
</body></html>
