<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobApp{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="/" class="font-semibold text-lg">JobApp</a>
      <span class="text-sm text-slate-500">Internship search for Jan–Aug 2027 · GTA / Remote</span>
      <a href="/followups" class="ml-auto text-sm text-blue-700 hover:underline">Follow-ups</a>
      <a href="/stats" class="text-sm text-blue-700 hover:underline">What's working</a>
      <a href="/tracker" class="text-sm text-blue-700 hover:underline">Sheet tracker</a>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6">{% block body %}{% endblock %}</main>
</body>
</html>
